[project]
name = "sax-spectrum-analyzer"
version = "0.1.0"
description = "Real-time audio spectrum analyzer with playback visualization"
requires-python = ">=3.9"
dependencies = [
    "librosa>=0.11.0",
    "numpy>=2.0.2",
    "pyqt6>=6.8.0",
    "pyqtgraph>=0.13.7",
    "scipy>=1.13.1",
    "sounddevice>=0.5.5",
    "soundfile>=0.13.0",
]

[project.scripts]
sax-spectrum-analyzer = "app:main"

[build-system]
requires = ["uv_build>=0.12.2,<0.13.0"]
build-backend = "uv_build"
